<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="可全文搜索的考研数学二公式、结论与题型知识库" />
    <!-- favicon 放在 public/ 根下，Vite 会原样复制到 dist/ 根目录。
         - %BASE_URL% 由 Vite 在构建期替换为 vite.config.ts 里的 base（/postgraduate-exam-website/），
           保证 GitHub Pages 二级目录部署时请求的是正确路径。
         - svg: 现代 Chrome/Firefox/Edge 默认用 48/64px 高分辨率显示
         - ico: 覆盖 Safari / 旧浏览器 / PWA 安装时的降级图标 -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" sizes="any" />
    <title>数学二知识库 · 公式与题型全文搜索</title>
    <script>
      // GitHub Pages 发布新版后，旧标签页可能仍引用已被替换的哈希资源。
      // 捕获资源加载失败并带时间戳刷新一次，避免页面停在空白状态。
      ;(() => {
        const key = 'math2-stale-assets-reload'
        const refreshOnce = () => {
          const lastAttempt = Number(sessionStorage.getItem(key) || 0)
          if (Date.now() - lastAttempt < 60_000) return
          sessionStorage.setItem(key, String(Date.now()))
          const url = new URL(window.location.href)
          url.searchParams.set('refresh', String(Date.now()))
          window.location.replace(url)
        }

        window.addEventListener('vite:preloadError', (event) => {
          event.preventDefault()
          refreshOnce()
        })

        window.addEventListener('error', (event) => {
          const target = event.target
          if (!(target instanceof HTMLElement)) return
          const assetUrl = target.getAttribute('src') || target.getAttribute('href') || ''
          if (assetUrl.includes('/assets/')) refreshOnce()
        }, true)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
