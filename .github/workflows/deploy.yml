name: Deploy to GitHub Pages

# 触发条件：
#   - 向 master 分支 push 时自动构建并发布
#   - Actions 页面手动触发（workflow_dispatch），方便手动重发
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # npm workspaces：构建期执行索引重建，需要加载 client 下 TypeScript
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build math content and frontend
        run: npm run build
        env:
          # Vite base：二级目录部署 → /<仓库名>/（可按需自定义域名覆盖）
          VITE_BASE_PATH: /postgraduate-exam-website/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
